name: build-engine-dosbox

# A manual run exists because the push triggers only ever produce `main` and
# `sha-<commit>`, and `appinfo/info.xml` demands a semver-ish tag (see
# scripts/verify-info-xml.sh). Without this, pointing the manifest at a real
# image meant cutting a release tag for something that is not a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "extra image tag, semver-ish (e.g. 0.1.0-wire-dev). No 'latest'."
        required: true
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'engines/dosbox-x/**'
      - '.github/workflows/build-engine-dosbox.yml'
  pull_request:
    paths:
      - 'engines/dosbox-x/**'
      - '.github/workflows/build-engine-dosbox.yml'

permissions:
  contents: read
  packages: write

# KasmVNC version pin. Keep in sync with the Dockerfile default; the
# release pipeline reads this when bumping. Verified 2026-05-08.
env:
  KASMVNC_VERSION: "1.4.0"

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: the manual tag must be one info.xml would accept
        # The same pattern as scripts/verify-info-xml.sh. A manual run exists to
        # produce a tag the manifest can point at; a tag it would reject is
        # worse than no tag, because the image looks published and the app
        # still cannot be installed.
        if: github.event_name == 'workflow_dispatch'
        # Through env, not interpolated into the script: an input that lands in
        # the shell source is an input that can be a shell command.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == "latest" ]] || ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not semver-ish (X.Y.Z[-prerelease][+build]) — see scripts/verify-info-xml.sh"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ash-nazg-dosbox-x
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: build (and push when not PR)
        uses: docker/build-push-action@v6
        with:
          context: ./engines/dosbox-x
          file: ./engines/dosbox-x/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KASMVNC_VERSION=${{ env.KASMVNC_VERSION }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=engine-dosbox
          cache-to: type=gha,scope=engine-dosbox,mode=max
